# Kaggle job definitions, read by scripts/run_job.py (schema documented in that file's docstring).
# The human only sets JOB_IDS (and optionally PARAMS) in kaggle/job_runner.ipynb; everything else is here.
# J00/J01/J01b are the Phase 0 jobs (reports/PHASE_0.md refers to them); S01..S18 are the sessions of
# docs/V2_PLAN_48H.md section 5 (S01 = J01, S02 = J01b).
macros:

  setup:                      # install pinned/lower-bound deps, check versions, pick splits, copy config to {out}/cfg
    defaults: {extras: []}
    steps:
      - {name: install, builtin: pip_install, extras: <<extras>>}
      - {name: check_env, run: ["{py}", scripts/check_env.py, --allow_mismatch], optional: true, soft: true, echo: false}
      - {name: resolve_splits, builtin: resolve_splits}
      - {name: make_config, builtin: make_config}

  prep:                       # 512 px PNGs of the listed splits (messy gets its pre-compression), no caches
    defaults: {splits: [test]}
    steps:
      - name: prepare_data
        run: ["{py}", scripts/prepare_data.py, "{celebahq_args}", --splits_dir, "{splits_dir}", --out_dir, "{out}/data",
              --splits, <<splits>>, --no_cache]

  protect:                    # protect one split with one method on both GPUs, then merge the shard CSVs
    defaults: {method: v1, split: test, run: "prot_<<method>>_<<split>>", extra: []}
    steps:
      - name: protect_<<run>>
        sharded: true
        run_id: <<run>>
        run: ["{py}", scripts/run_protect.py, --config, "{cfg}", --method, <<method>>, --input_dir,
              "{out}/data/<<split>>", --list, "{splits_dir}/<<split>>.txt", "{limit_args}", --run_id, <<run>>,
              --output_root, "{results}", --checkpoint_every, "5", --split, <<split>>, "{iters_args}", <<extra>>,
              "{resume_arg}"]
      - name: merge_<<run>>
        run: ["{py}", scripts/merge_shards.py, --run_dir, "{results}/<<run>>"]

  evaluate:                   # edit + score jobs (scripts/evaluate.py --jobs_file); models stay loaded between jobs
    defaults: {name: eval, defs: {}, jobs: []}
    steps:
      - name: <<name>>
        sharded: true
        optional: true
        eval_jobs: {defaults: <<defs>>, jobs: <<jobs>>}
        run: ["{py}", scripts/evaluate.py, --jobs_file, "{jobs_file}"]

jobs:

  J00:
    title: Environment probe (pip freeze, GPU/CUDA info, HF model hashes). CPU session is enough.
    accelerator: cpu
    params: {}
    steps:
      - name: env_probe
        run: ["{py}", "scripts/env_probe.py", "--out", "{out}/env_probe"]

  J01:
    title: Phase 0 - reproduce v1 Phase 1 on the 70 original evaluation images (budget check + invisibility metrics)
    accelerator: gpu_t4x2
    params:
      n_images: 70        # 5 = smoke test
      iters: 40
      run_tests: true
      backend: real       # 'tiny' only for local CPU tests of this pipeline
      image_size: 512
      extra_args: []
    steps:
      - name: install
        builtin: pip_install
      - name: check_env
        run: ["{py}", "scripts/check_env.py", "--allow_mismatch"]
        optional: true
        soft: true
      - name: tests
        when: run_tests
        timeout_min: 15
        allow_timeout: true
        run: ["{py}", "-m", "pytest", "-q", "-x", "tests", "-p", "no:cacheprovider"]
        optional: true
        soft: true
        echo: false
      - name: prepare_data
        run: ["{py}", "scripts/prepare_v1_data.py", "--from_manifest", "--out_dir", "{out}/data/v1_inputs",
              "--which", "eval", "--limit", "{n_images}", "--size", "{image_size}"]
      - name: protect
        sharded: true
        run: ["{py}", "scripts/run_protect.py", "--config", "config/config.yaml", "--method", "v1",
              "--input_dir", "{out}/data/v1_inputs", "--list", "data/splits/v1_eval70.txt",
              "--limit", "{n_images}", "--run_id", "{run_id}", "--output_root", "{results}",
              "--checkpoint_every", "5", "--set", "budget.iters={iters}", "--split", "v1_eval70",
              "--backend", "{backend}", "--set", "data.image_size={image_size}", "{extra_args}", "{resume_arg}"]
      - name: merge
        run: ["{py}", "scripts/merge_shards.py", "--run_dir", "{results}/{run_id}", "--list",
              "data/splits/v1_eval70.txt"]
      - name: budget_check
        run: ["{py}", "scripts/budget_check.py", "--clean_dir", "{out}/data/v1_inputs",
              "--protected_dir", "{results}/{run_id}/images", "--run_id", "{run_id}", "--output_root", "{results}"]
      - name: tables
        run: ["{py}", "scripts/make_tables.py", "--run_id", "{run_id}", "--output_root", "{results}",
              "--table", "invisibility"]
      - name: compare_to_v1
        run: ["{py}", "scripts/compare_runs.py", "--a", "{results}/{run_id}", "--v1_csv",
              "data/v1_ref/stage1_per_image_metrics.csv"]
        optional: true
        soft: true
      - name: ledger
        run: ["{py}", "scripts/gpu_ledger.py", "--results", "{results}"]
        optional: true
        soft: true

  # Same as J01, run by a second person / account (compare_runs.py --a J01 --b J01b afterwards).
  J01b:
    title: Phase 0 - second-person reproduction (identical spec to J01)
    extends: J01

  # ================================================================================================
  # Sessions S01..S18 of docs/V2_PLAN_48H.md section 5.  Run with JOB_IDS=["S06"] (or a list).
  # Every session: PARAMS={"smoke": true} runs it end to end with 5 images, 5 iterations, 1 edit seed.
  # Sessions that need an earlier session's output take  prev_root  (the /kaggle/input/<name> mount of that output).
  # ================================================================================================

  S01:
    title: S01 = J01 (Phase 0 v1 reproduction, acct1)
    extends: J01
  S02:
    title: S02 = J01b (Phase 0 reproduction by a second person, acct3)
    extends: J01b

  # ---------------------------------------------------------------------------------------------- S03
  S03:
    title: S03 splits (test100, messy20, train20, val20, ae_pool120; v1 calib excluded), ArcFace dedup, caches. CPU is enough.
    accelerator: cpu
    params: {smoke: false, extra_args: []}
    steps:
      - {name: install, builtin: pip_install, extras: [eval]}
      - {name: check_env, run: ["{py}", scripts/check_env.py, --allow_mismatch], optional: true, soft: true, echo: false}
      - name: make_splits            # PARAMS {"extra_args": ["--allow_no_dedup", "--identity_mode", "none"]} if insightface fails
        run: ["{py}", scripts/make_splits.py, "{celebahq_args}", --out_dir, "{out}/splits_out", --identity_mode, auto,
              "{extra_args}"]
      - {name: use_splits, builtin: set_var, vars: {splits_dir: "{out}/splits_out"}}
      - name: prepare_check
        run: ["{py}", scripts/prepare_data.py, "{celebahq_args}", --splits_dir, "{out}/splits_out", --out_dir,
              "{out}/data", --cache_dir, "{out}/cache", "{parsing_args}"]
        soft: true
        optional: true

  # ---------------------------------------------------------------------------------------------- S04
  S04:
    title: S04 protection smoke - every method on 5 images, 5 iterations (timings -> smoke_report.md)
    accelerator: gpu_t4x2
    params: {smoke: true}
    steps:
      - {macro: setup}
      - {macro: prep, with: {splits: [test]}}
      - {macro: protect, with: {method: v1}}
      - {macro: protect, with: {method: v2_cheap}}
      - {macro: protect, with: {method: v2_main}}
      - {macro: protect, with: {method: v2_antipure}}
      - {macro: protect, with: {method: v2_final}}
      - {macro: protect, with: {method: abl_vis_only}}
      - {macro: protect, with: {method: abl_den_only}}
      - {macro: protect, with: {method: abl_no_sem}}
      - {macro: protect, with: {method: abl_no_pur}}
      - {macro: protect, with: {method: eps2}}
      - {macro: protect, with: {method: noise_uniform}}
      - macro: protect
        with: {method: noise_gauss_psnr,
               extra: ["--set", "baselines.noise_gauss_psnr.psnr_csv=data/v1_ref/stage1_per_image_metrics.csv"]}
      - {macro: protect, with: {method: photoguard}}
      - {macro: protect, with: {method: mist}}
      - {name: smoke_report, run: ["{py}", scripts/smoke_report.py, --root, "{results}", --out, "{results}/smoke_report.md"],
         soft: true, optional: true}

  # ---------------------------------------------------------------------------------------------- S04t
  S04t:
    title: S04t protection timing probe - 4 images x 10 iterations for the slow methods + PhotoGuard + Mist (replaces the S04 failure tail)
    accelerator: gpu_t4x2
    params: {n_images: 4, iters: 10}
    steps:
      - {macro: setup}
      - {macro: prep, with: {splits: [test]}}
      - {macro: protect, with: {method: v2_cheap}}
      - {macro: protect, with: {method: v2_main}}
      - {macro: protect, with: {method: v2_antipure}}
      - {macro: protect, with: {method: v2_final}}
      - {macro: protect, with: {method: photoguard}}
      - {macro: protect, with: {method: mist}}
      - {name: smoke_report, run: ["{py}", scripts/smoke_report.py, --root, "{results}", --out, "{results}/smoke_report.md"],
         soft: true, optional: true}

  # ---------------------------------------------------------------------------------------------- S04u
  S04u:
    title: S04u fp16-autocast VAE speed/quality probe - same 4 images x 10 iterations as S04t (fp32 control, then autocast, then autocast without checkpointing)
    accelerator: gpu_t4x2
    params: {n_images: 4, iters: 10}
    steps:
      - {macro: setup}
      - {macro: prep, with: {splits: [test]}}
      - {macro: protect, with: {method: v2_main, run: prot_v2_main_fp32_test}}
      - {macro: protect, with: {method: v2_main, run: prot_v2_main_ac_test, extra: ["--set", "runtime.vae_dtype_protect=autocast"]}}
      - {macro: protect, with: {method: v2_cheap, run: prot_v2_cheap_ac_test, extra: ["--set", "runtime.vae_dtype_protect=autocast"]}}
      - {macro: protect, with: {method: v2_final, run: prot_v2_final_ac_test, extra: ["--set", "runtime.vae_dtype_protect=autocast"]}}
      - macro: protect
        with: {method: v2_main, run: prot_v2_main_ac_nockpt_test,
               extra: ["--set", "runtime.vae_dtype_protect=autocast", "--set", "runtime.grad_checkpointing=false"]}
      - {name: smoke_report, run: ["{py}", scripts/smoke_report.py, --root, "{results}", --out, "{results}/smoke_report.md"],
         soft: true, optional: true}

  # ---------------------------------------------------------------------------------------------- S05
  S05:
    title: S05 edit/purifier smoke - all editors, purifiers, GrIDPure attempt, LPIPS and threshold stages (5 images, 1 seed)
    accelerator: gpu_t4x2
    params: {smoke: true}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test, val, messy]}}
      - {macro: protect, with: {method: noise_uniform, split: test}}
      - {macro: protect, with: {method: noise_uniform, split: val}}
      - {macro: protect, with: {method: noise_uniform, split: messy}}
      - macro: evaluate
        with:
          name: smoke_tiers
          defs: {no_generate_clean: false}
          jobs:
            - {name: smoke_clean_test, tier: SMOKE, method: clean, split: test}
            - {name: smoke_clean_val, tier: SMOKE, method: clean, split: val}
            - {name: smoke_clean_messy, tier: SMOKE, method: clean, split: messy}
            - {name: smoke_noise_uniform_test, tier: SMOKE, method: noise_uniform, split: test}
            - {name: smoke_noise_uniform_val, tier: SMOKE, method: noise_uniform, split: val}
            - {name: smoke_noise_uniform_messy, tier: SMOKE, method: noise_uniform, split: messy}
      - macro: evaluate
        with:
          name: smoke_all_purifiers
          defs: {no_generate_clean: false, limit: 2}
          jobs:
            - {name: smoke_purifiers_clean, tier: P, method: clean, split: test, editor: sd15_img2img,
               purifier: "jpeg_q90,jpeg_q50,jpeg_other,downup_other,diffpure_0.05,diffpure_0.2,diffpure_0.3,restore_swin2sr,gridpure"}
      - name: lpips_stage
        run: ["{py}", scripts/evaluate.py, --stage, lpips, --config, "{cfg}", --out, "{results}/smoke_noise_uniform_test",
              --split, test, --source_dir, "{out}/data/test", --cache_dir, "{out}/cache",
              --clean_edits_dir, "{out}/cache/clean_edits"]
        optional: true
        soft: true
      - name: thresholds_stage
        run: ["{py}", scripts/evaluate.py, --stage, thresholds, --config, "{cfg}", --split, test, --split_file,
              "{splits_dir}/test.txt", --source_dir, "{out}/data/test", --cache_dir, "{out}/cache", --out,
              "{results}/thresholds", "{limit_args}"]
        optional: true
        soft: true
      - {name: smoke_report, run: ["{py}", scripts/smoke_report.py, --root, "{results}", --out, "{results}/smoke_report.md"],
         soft: true, optional: true}

  # ---------------------------------------------------------------------------------------------- S06
  S06:
    title: S06 Optuna on val (cap 3 h) -> tuned v2_final -> protect v2_final test+messy (edits are in S16)
    accelerator: gpu_t4x2
    params: {smoke: false, optuna_trials: 16, optuna_images: 10, optuna_iters: 20, confirm_images: 20, final_yaml: ""}
    smoke_params: {optuna_trials: 2, optuna_images: 2, optuna_iters: 3, confirm_images: 2}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [val, test, messy]}}
      - name: prepare_optuna_dir      # also restores an Optuna study from an earlier session (RESUME_FROM)
        run: ["{py}", -c, "import os, shutil; os.makedirs('{out}/optuna', exist_ok=True); s = os.path.join('{resume_root}', 'optuna'); shutil.copytree(s, '{out}/optuna', dirs_exist_ok=True) if os.path.isdir(s) else None"]
      - name: tune
        workers: true
        timeout_min: 180
        allow_timeout: true
        run: ["{py}", scripts/tune_optuna.py, --config, "{cfg}", --storage, "sqlite:///{out}/optuna/v2_final.db",
              --study, v2_final, --n-trials, "{optuna_trials}", --n-images, "{optuna_images}", --iters, "{optuna_iters}",
              --image-dir, "{out}/data/val", --val-list, "{splits_dir}/val.txt", --out-dir, "{out}/optuna",
              --device, cuda]
      - name: confirm
        run: ["{py}", scripts/tune_optuna.py, --config, "{cfg}", --storage, "sqlite:///{out}/optuna/v2_final.db",
              --study, v2_final, --confirm-top, "3", --confirm-images, "{confirm_images}", --confirm-iters, "{optuna_iters}",
              --image-dir, "{out}/data/val", --val-list, "{splits_dir}/val.txt", --out-dir, "{out}/optuna",
              --device, cuda]
        optional: true
      - name: make_config_tuned
        builtin: make_config
        final_yaml: "{out}/optuna/v2_final/final_candidate.yaml"
        optional: true
      - {macro: protect, with: {method: v2_final, split: test}}
      - {macro: protect, with: {method: v2_final, split: messy}}
      # Tier H edits of v2_final moved to S16 (S04t/S04u: v2_final costs ~2x the plan, so S06 would pass the 11 h wall guard)

  # ---------------------------------------------------------------------------------------------- S07
  S07:
    title: S07 Phase 5 single-term antipure ablation on val -> E0 clean edits (H, M, P) -> PSR thresholds
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [val, test, messy]}}
      - {macro: protect, with: {method: v2_antipure, split: val, run: prot_ap_hf_val,
                                extra: ["--set", "methods.v2_antipure.loss.anti_purify.w_mono=0.0"]}}
      - {macro: protect, with: {method: v2_antipure, split: val, run: prot_ap_mono_val,
                                extra: ["--set", "methods.v2_antipure.loss.anti_purify.w_hf=0.0"]}}
      - {macro: protect, with: {method: v2_antipure, split: val, run: prot_ap_both_val}}
      - macro: evaluate
        with:
          name: antipure_val
          defs: {no_generate_clean: false}
          jobs:
            - {name: eval_ap_hf_val, tier: AP, method: v2_antipure, split: val, editor: sd15_img2img,
               purifier: "jpeg_q75,vae_rt,diffpure_0.1", protected_dir: "{results}/prot_ap_hf_val/images"}
            - {name: eval_ap_mono_val, tier: AP, method: v2_antipure, split: val, editor: sd15_img2img,
               purifier: "jpeg_q75,vae_rt,diffpure_0.1", protected_dir: "{results}/prot_ap_mono_val/images"}
            - {name: eval_ap_both_val, tier: AP, method: v2_antipure, split: val, editor: sd15_img2img,
               purifier: "jpeg_q75,vae_rt,diffpure_0.1", protected_dir: "{results}/prot_ap_both_val/images"}
            - {name: eval_clean_val, tier: AP, method: clean, split: val, editor: sd15_img2img,
               purifier: "jpeg_q75,vae_rt,diffpure_0.1"}
      - macro: evaluate
        with:
          name: e0
          defs: {no_generate_clean: false}
          jobs:
            - {name: e0_clean_H, tier: H, method: clean, split: test}
            - {name: e0_clean_M, tier: M, method: clean, split: messy}
            - {name: e0_clean_P, tier: P, purifier: all, method: clean, split: test}
      - name: thresholds
        run: ["{py}", scripts/evaluate.py, --stage, thresholds, --config, "{cfg}", --split, test, --split_file,
              "{splits_dir}/test.txt", --source_dir, "{out}/data/test", --cache_dir, "{out}/cache", --out,
              "{results}/thresholds", "{limit_args}"]
        optional: true

  # ---------------------------------------------------------------------------------------------- S08
  S08:
    title: S08 protect v1 (test+messy) -> E3 edits (H, M, P)
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test, messy]}}
      - {macro: protect, with: {method: v1, split: test}}
      - {macro: protect, with: {method: v1, split: messy}}
      - macro: evaluate
        with:
          name: e3
          jobs:
            - {name: eval_v1_H, tier: H, method: v1, split: test}
            - {name: eval_v1_M, tier: M, method: v1, split: messy}
            - {name: eval_v1_P, tier: P, purifier: all, method: v1, split: test}

  # ---------------------------------------------------------------------------------------------- S09
  S09:
    title: S09 protect v2_main (test+messy) -> E5 edits (H, M, P incl. FaceID subset)
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test, messy]}}
      - {macro: protect, with: {method: v2_main, split: test}}
      - {macro: protect, with: {method: v2_main, split: messy}}
      - macro: evaluate
        with:
          name: e5
          jobs:
            - {name: eval_v2_main_H, tier: H, method: v2_main, split: test}
            - {name: eval_v2_main_M, tier: M, method: v2_main, split: messy}
            - {name: eval_v2_main_P, tier: P, purifier: all, method: v2_main, split: test}

  # ---------------------------------------------------------------------------------------------- S10
  S10:
    title: S10 protect v2_cheap (test) -> E4 edits (H, P) + E0 clean purifier tier (P)
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test]}}
      - {macro: protect, with: {method: v2_cheap, split: test}}
      - macro: evaluate
        with:
          name: e4
          defs: {no_generate_clean: false}
          jobs:
            - {name: eval_v2_cheap_H, tier: H, method: v2_cheap, split: test}
            - {name: eval_v2_cheap_P, tier: P, purifier: all, method: v2_cheap, split: test}
            # E0 clean purifier tier moved here from S07 (S07's copy expanded to zero jobs); needs no protected images
            - {name: e0_clean_P, tier: P, purifier: all, method: clean, split: test}

  # ---------------------------------------------------------------------------------------------- S11
  S11:
    title: S11 protect abl_vis_only + abl_den_only (test) -> E7a edits (tier A)
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test]}}
      - {macro: protect, with: {method: abl_vis_only, split: test}}
      - {macro: protect, with: {method: abl_den_only, split: test}}
      - macro: evaluate
        with:
          name: e7a
          jobs:
            - {name: eval_abl_vis_den_A, tier: A, purifier: all, method: "abl_vis_only,abl_den_only", split: test}

  # ---------------------------------------------------------------------------------------------- S12
  S12:
    title: S12 protect v2_antipure (test) -> E6 edits (tier P incl. FaceID none)
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test]}}
      - {macro: protect, with: {method: v2_antipure, split: test}}
      - macro: evaluate
        with:
          name: e6
          jobs:
            - {name: eval_v2_antipure_P, tier: P, purifier: all, method: v2_antipure, split: test}

  # ---------------------------------------------------------------------------------------------- S13
  S13:
    title: S13 protect PhotoGuard (test+messy) -> E2 edits (H, M, P)   [Mist moved to S21 so that neither session can pass 11 h]
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test, messy]}}
      - {macro: protect, with: {method: photoguard, split: test}}
      - {macro: protect, with: {method: photoguard, split: messy}}
      - macro: evaluate
        with:
          name: e2_pg
          jobs:
            - {name: eval_pg_H, tier: H, method: photoguard, split: test}
            - {name: eval_pg_M, tier: M, method: photoguard, split: messy}
            - {name: eval_pg_P, tier: P, purifier: all, method: photoguard, split: test}

  S21:
    title: S21 protect Mist (test+messy; official target image fetched at runtime) -> E2 edits (H, M, P)
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test, messy]}}
      # official Mist target image (GPL-3.0 repo): fetched at runtime, never vendored into the bundle
      - name: fetch_mist_target
        run: ["{py}", "-c", "import os,sys,urllib.request as u; p=sys.argv[2]; os.makedirs(os.path.dirname(p),exist_ok=True); u.urlretrieve(sys.argv[1],p); print('saved',p,os.path.getsize(p))",
              "https://raw.githubusercontent.com/psyker-team/mist/99f5f3c455022bef77ef25ba440a4289ea472d25/MIST.png",
              "{out}/assets/MIST.png"]
      - {macro: protect, with: {method: mist, split: test, extra: ["--set", "baselines.mist.target_image={out}/assets/MIST.png"]}}
      - {macro: protect, with: {method: mist, split: messy, extra: ["--set", "baselines.mist.target_image={out}/assets/MIST.png"]}}
      - macro: evaluate
        with:
          name: e2_mist
          jobs:
            - {name: eval_mist_H, tier: H, method: mist, split: test}
            - {name: eval_mist_M, tier: M, method: mist, split: messy}
            - {name: eval_mist_P, tier: P, purifier: all, method: mist, split: test}

  # ---------------------------------------------------------------------------------------------- S14
  S14:
    title: S14 protect abl_no_sem + abl_no_pur (100 photos) -> E7b edits   [noise controls moved to S22]
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test, messy]}}
      - {macro: protect, with: {method: abl_no_sem, split: test}}
      - {macro: protect, with: {method: abl_no_pur, split: test}}
      - macro: evaluate
        with:
          name: e7b
          jobs:
            - {name: eval_abl_nosem_nopur_A, tier: A, purifier: all, method: "abl_no_sem,abl_no_pur", split: test}

  S22:
    title: S22 noise controls (uniform at eps=4, Gaussian matched to v1's PSNR; CPU protection) -> E1 edits (H, M)
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test, messy]}}
      - {macro: protect, with: {method: noise_uniform, split: test}}
      - {macro: protect, with: {method: noise_uniform, split: messy}}
      - macro: protect
        with: {method: noise_gauss_psnr, split: test,
               extra: ["--set", "baselines.noise_gauss_psnr.psnr_csv=data/v1_ref/stage1_per_image_metrics.csv"]}
      - macro: protect
        with: {method: noise_gauss_psnr, split: messy,
               extra: ["--set", "baselines.noise_gauss_psnr.psnr_csv=data/v1_ref/stage1_per_image_metrics.csv"]}
      - macro: evaluate
        with:
          name: e1
          jobs:
            - {name: eval_noise_H, tier: H, method: "noise_uniform,noise_gauss_psnr", split: test}
            - {name: eval_noise_M, tier: M, method: "noise_uniform,noise_gauss_psnr", split: messy}

  # ---------------------------------------------------------------------------------------------- S15
  S15:
    title: S15 E8 adaptive attacker - protect AE pool with v2_final (K=2) + v1 on test -> train AE (1 h) -> edits
    accelerator: gpu_t4x2
    params:
      smoke: false
      prev_root: ""            # /kaggle/input/<S06 output>; needs S06/results/prot_v2_final_test (the v2_final protected photos)
      final_yaml: ""           # the tuned config is in the bundle (config/parts/final.yaml); do not point this at the S06 output
      ae_minutes: 60
    smoke_params: {ae_minutes: 1}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test, ae_pool]}}
      - {name: v2final_src_prev, when_not: smoke, builtin: set_var, vars: {v2final_results: "{prev_root}/S06/results"}}
      - {name: v2final_src_local, when: smoke, builtin: set_var, vars: {v2final_results: "{results}"}}
      - macro: protect
        with: {method: v2_final, split: test}
        when: smoke
      - macro: protect
        with: {method: v2_final, split: ae_pool, extra: ["--set", "methods.v2_final.eot.k_draws=2"]}
      - {macro: protect, with: {method: v1, split: test}}
      - name: restore_ae_ckpt
        run: ["{py}", -c, "import os, shutil; os.makedirs('{out}/adaptive_ae', exist_ok=True); s = os.path.join('{resume_root}', 'adaptive_ae'); shutil.copytree(s, '{out}/adaptive_ae', dirs_exist_ok=True) if os.path.isdir(s) else None"]
      - name: train_ae
        run: ["{py}", scripts/train_adaptive_ae.py, --protected_dir, "{results}/prot_v2_final_ae_pool/images",
              --clean_dir, "{out}/data/ae_pool", --out, "{out}/adaptive_ae/ae_final.pt", --minutes, "{ae_minutes}", --resume]
      - macro: evaluate
        with:
          name: e8
          defs: {set: ["adaptive_ae.weights_path={out}/adaptive_ae/ae_final.pt"]}
          jobs:
            - {name: eval_ae_clean, tier: E8, purifier: all, method: clean, split: test}
            - {name: eval_ae_v1, tier: E8, purifier: all, method: v1, split: test}
            - {name: eval_ae_v2_final, tier: E8, purifier: all, method: v2_final, split: test,
               protected_dir: "{v2final_results}/prot_v2_final_test/images"}

  # ---------------------------------------------------------------------------------------------- S16
  S16:
    title: S16 v2_final edits from the S06 protected images - Tier H (no SDXL), SDXL (H), Tier P, FaceID-P, IP2P-P, messy (M)
    accelerator: gpu_t4x2
    params: {smoke: false, prev_root: "", final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test, messy]}}
      - {name: v2final_src_prev, when_not: smoke, builtin: set_var, vars: {v2final_results: "{prev_root}/S06/results"}}
      - {name: v2final_src_local, when: smoke, builtin: set_var, vars: {v2final_results: "{results}"}}
      - macro: protect
        with: {method: v2_final, split: test}
        when: smoke
      - macro: protect                      # S06 timed out while protecting the messy photos: redo them here (tuned config via final_yaml)
        with: {method: v2_final, split: messy}
      - macro: evaluate
        with:
          name: v2_final_rest
          jobs:
            - {name: eval_v2_final_H, tier: H, method: v2_final, split: test,
               editor: "sd15_img2img,ip2p,sd_inpaint,ipadapter_faceid",
               protected_dir: "{v2final_results}/prot_v2_final_test/images"}
            - {name: eval_v2_final_P, tier: P, purifier: all, method: v2_final, split: test,
               protected_dir: "{v2final_results}/prot_v2_final_test/images"}
            - {name: eval_v2_final_M, tier: M, method: v2_final, split: messy,
               protected_dir: "{results}/prot_v2_final_messy/images"}
            - {name: eval_v2_final_H_sdxl, tier: H, method: v2_final, split: test, editor: sdxl_img2img,
               protected_dir: "{v2final_results}/prot_v2_final_test/images"}

  # ---------------------------------------------------------------------------------------------- S19 / S20 (re-runs)
  # S07/S08/S09 ran their purifier-tier (P) jobs with the evaluate.py default `--purifier none`, which expands to ZERO jobs
  # for tier P (and the val antipure ablation had no val rule). These sessions redo exactly those jobs from the protected
  # images that S07/S08/S09 already wrote (add each earlier session's Notebook Output as an input, same account).
  S19:
    title: S19 purifier tier (P) for v1 and v2_main from the S08 / S09 protected images (re-run of the empty eval_v1_P / eval_v2_main_P)
    accelerator: gpu_t4x2
    params: {smoke: false, prev_root_s08: "", prev_root_s09: "", final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test]}}
      - {name: src_s08, builtin: set_var, vars: {s08_results: "{prev_root_s08}/S08/results"}}
      - {name: src_s09, builtin: set_var, vars: {s09_results: "{prev_root_s09}/S09/results"}}
      - macro: evaluate
        with:
          name: p_rerun
          defs: {no_generate_clean: false}
          jobs:
            - {name: eval_v1_P, tier: P, purifier: all, method: v1, split: test,
               protected_dir: "{s08_results}/prot_v1_test/images"}
            - {name: eval_v2_main_P, tier: P, purifier: all, method: v2_main, split: test,
               protected_dir: "{s09_results}/prot_v2_main_test/images"}

  S20:
    title: S20 val antipure single-term ablation from the S07 protected images (re-run of the empty S07 jobs; the clean P tier moved to S10)
    accelerator: gpu_t4x2
    params: {smoke: false, prev_root_s07: "", final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [val]}}
      - {name: src_s07, builtin: set_var, vars: {s07_results: "{prev_root_s07}/S07/results"}}
      - macro: evaluate
        with:
          name: ap_rerun
          defs: {no_generate_clean: false}
          jobs:
            - {name: eval_ap_hf_val, tier: AP, method: v2_antipure, split: val, editor: sd15_img2img,
               purifier: "jpeg_q75,vae_rt,diffpure_0.1", protected_dir: "{s07_results}/prot_ap_hf_val/images"}
            - {name: eval_ap_mono_val, tier: AP, method: v2_antipure, split: val, editor: sd15_img2img,
               purifier: "jpeg_q75,vae_rt,diffpure_0.1", protected_dir: "{s07_results}/prot_ap_mono_val/images"}
            - {name: eval_ap_both_val, tier: AP, method: v2_antipure, split: val, editor: sd15_img2img,
               purifier: "jpeg_q75,vae_rt,diffpure_0.1", protected_dir: "{s07_results}/prot_ap_both_val/images"}
            - {name: eval_clean_val, tier: AP, method: clean, split: val, editor: sd15_img2img,
               purifier: "jpeg_q75,vae_rt,diffpure_0.1"}
  # ---------------------------------------------------------------------------------------------- S17 / S18
  S17:
    title: S17 E9 eps=2 (100 photos, protect then edits); the tuned config/parts/final.yaml is in the bundle   [eps=6 is S23]
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test]}}
      - {macro: protect, with: {method: eps2, split: test}}
      - macro: evaluate
        with:
          name: e9_eps2
          jobs:
            - {name: eval_eps2_E9, tier: E9, purifier: all, method: eps2, split: test}

  S23:
    title: S23 E9 eps=6 (100 photos, protect then edits)
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test]}}
      - {macro: protect, with: {method: eps6, split: test}}
      - macro: evaluate
        with:
          name: e9_eps6
          jobs:
            - {name: eval_eps6_E9, tier: E9, purifier: all, method: eps6, split: test}

  S18:
    title: S18 E9 eps=8 (protect + edits); needs config/parts/final.yaml in the bundle (B3) or final_yaml
    accelerator: gpu_t4x2
    params: {smoke: false, final_yaml: ""}
    steps:
      - {macro: setup, with: {extras: [eval]}}
      - {macro: prep, with: {splits: [test]}}
      - {macro: protect, with: {method: eps8, split: test}}
      - macro: evaluate
        with:
          name: e9_eps8
          jobs:
            - {name: eval_eps8_E9, tier: E9, purifier: all, method: eps8, split: test}
