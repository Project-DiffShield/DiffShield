defaults:
  no_generate_clean: false
  set: []
  config: /kaggle/working/S24/cfg/config.yaml
  cache_dir: /kaggle/working/S24/cache
  parsing_dir: /kaggle/input/datasets/ipythonx/celebamaskhq/CelebAMask-HQ/CelebAMask-HQ-mask-anno
jobs:
- name: scr_clean
  tier: SCREEN
  purifier: all
  method: clean
  split: val
  split_file: /kaggle/tmp/DiffShield/data/splits/val.txt
  source_dir: /kaggle/working/S24/data/val
  out: /kaggle/working/S24/results/scr_clean
- name: scr_v1
  tier: SCREEN
  purifier: all
  method: v1
  split: val
  split_file: /kaggle/tmp/DiffShield/data/splits/val.txt
  source_dir: /kaggle/working/S24/data/val
  protected_dir: /kaggle/working/S24/results/prot_{method}_val/images
  out: /kaggle/working/S24/results/scr_v1
- name: scr_mist
  tier: SCREEN
  purifier: all
  method: mist
  split: val
  split_file: /kaggle/tmp/DiffShield/data/splits/val.txt
  source_dir: /kaggle/working/S24/data/val
  protected_dir: /kaggle/working/S24/results/prot_{method}_val/images
  out: /kaggle/working/S24/results/scr_mist
- name: scr_photoguard
  tier: SCREEN
  purifier: all
  method: photoguard
  split: val
  split_file: /kaggle/tmp/DiffShield/data/splits/val.txt
  source_dir: /kaggle/working/S24/data/val
  protected_dir: /kaggle/working/S24/results/prot_{method}_val/images
  out: /kaggle/working/S24/results/scr_photoguard
- name: scr_v2_main
  tier: SCREEN
  purifier: all
  method: v2_main
  split: val
  split_file: /kaggle/tmp/DiffShield/data/splits/val.txt
  source_dir: /kaggle/working/S24/data/val
  protected_dir: /kaggle/working/S24/results/prot_{method}_val/images
  out: /kaggle/working/S24/results/scr_v2_main
