defaults:
  set: []
  config: /kaggle/working/S09/cfg/config.yaml
  cache_dir: /kaggle/working/S09/cache
  no_generate_clean: true
  parsing_dir: /kaggle/input/datasets/ipythonx/celebamaskhq/CelebAMask-HQ/CelebAMask-HQ-mask-anno
jobs:
- name: eval_v2_main_H
  tier: H
  method: v2_main
  split: test
  split_file: /kaggle/tmp/DiffShield/data/splits/test.txt
  source_dir: /kaggle/working/S09/data/test
  protected_dir: /kaggle/working/S09/results/prot_{method}_test/images
  out: /kaggle/working/S09/results/eval_v2_main_H
- name: eval_v2_main_M
  tier: M
  method: v2_main
  split: messy
  split_file: /kaggle/tmp/DiffShield/data/splits/messy.txt
  source_dir: /kaggle/working/S09/data/messy
  protected_dir: /kaggle/working/S09/results/prot_{method}_messy/images
  out: /kaggle/working/S09/results/eval_v2_main_M
- name: eval_v2_main_P
  tier: P
  method: v2_main
  split: test
  split_file: /kaggle/tmp/DiffShield/data/splits/test.txt
  source_dir: /kaggle/working/S09/data/test
  protected_dir: /kaggle/working/S09/results/prot_{method}_test/images
  out: /kaggle/working/S09/results/eval_v2_main_P
