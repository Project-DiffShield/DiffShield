defaults:
  set: []
  config: /kaggle/working/S08/cfg/config.yaml
  cache_dir: /kaggle/working/S08/cache
  no_generate_clean: true
  parsing_dir: /kaggle/input/datasets/ipythonx/celebamaskhq/CelebAMask-HQ/CelebAMask-HQ-mask-anno
jobs:
- name: eval_v1_H
  tier: H
  method: v1
  split: test
  split_file: /kaggle/tmp/DiffShield/data/splits/test.txt
  source_dir: /kaggle/working/S08/data/test
  protected_dir: /kaggle/working/S08/results/prot_{method}_test/images
  out: /kaggle/working/S08/results/eval_v1_H
- name: eval_v1_M
  tier: M
  method: v1
  split: messy
  split_file: /kaggle/tmp/DiffShield/data/splits/messy.txt
  source_dir: /kaggle/working/S08/data/messy
  protected_dir: /kaggle/working/S08/results/prot_{method}_messy/images
  out: /kaggle/working/S08/results/eval_v1_M
- name: eval_v1_P
  tier: P
  method: v1
  split: test
  split_file: /kaggle/tmp/DiffShield/data/splits/test.txt
  source_dir: /kaggle/working/S08/data/test
  protected_dir: /kaggle/working/S08/results/prot_{method}_test/images
  out: /kaggle/working/S08/results/eval_v1_P
