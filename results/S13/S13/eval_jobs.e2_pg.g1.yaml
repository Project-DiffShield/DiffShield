defaults:
  set: []
  config: /kaggle/working/S13/cfg/config.yaml
  cache_dir: /kaggle/working/S13/cache
  no_generate_clean: true
  parsing_dir: /kaggle/input/datasets/ipythonx/celebamaskhq/CelebAMask-HQ/CelebAMask-HQ-mask-anno
jobs:
- name: eval_pg_H
  tier: H
  method: photoguard
  split: test
  split_file: /kaggle/tmp/DiffShield/data/splits/test.txt
  source_dir: /kaggle/working/S13/data/test
  protected_dir: /kaggle/working/S13/results/prot_{method}_test/images
  out: /kaggle/working/S13/results/eval_pg_H
- name: eval_pg_M
  tier: M
  method: photoguard
  split: messy
  split_file: /kaggle/tmp/DiffShield/data/splits/messy.txt
  source_dir: /kaggle/working/S13/data/messy
  protected_dir: /kaggle/working/S13/results/prot_{method}_messy/images
  out: /kaggle/working/S13/results/eval_pg_M
- name: eval_pg_P
  tier: P
  purifier: all
  method: photoguard
  split: test
  split_file: /kaggle/tmp/DiffShield/data/splits/test.txt
  source_dir: /kaggle/working/S13/data/test
  protected_dir: /kaggle/working/S13/results/prot_{method}_test/images
  out: /kaggle/working/S13/results/eval_pg_P
