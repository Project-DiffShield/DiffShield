defaults:
  no_generate_clean: false
  limit: 5
  set:
  - eval.seeds=[1]
  config: /kaggle/working/S05/cfg/config.yaml
  cache_dir: /kaggle/working/S05/cache
  parsing_dir: /kaggle/input/datasets/ipythonx/celebamaskhq/CelebAMask-HQ/CelebAMask-HQ-mask-anno
jobs:
- name: smoke_clean_test
  tier: SMOKE
  method: clean
  split: test
  split_file: /kaggle/working/S05/splits/test.txt
  source_dir: /kaggle/working/S05/data/test
  out: /kaggle/working/S05/results/smoke_clean_test
- name: smoke_clean_val
  tier: SMOKE
  method: clean
  split: val
  split_file: /kaggle/working/S05/splits/val.txt
  source_dir: /kaggle/working/S05/data/val
  out: /kaggle/working/S05/results/smoke_clean_val
- name: smoke_clean_messy
  tier: SMOKE
  method: clean
  split: messy
  split_file: /kaggle/working/S05/splits/messy.txt
  source_dir: /kaggle/working/S05/data/messy
  out: /kaggle/working/S05/results/smoke_clean_messy
- name: smoke_noise_uniform_test
  tier: SMOKE
  method: noise_uniform
  split: test
  split_file: /kaggle/working/S05/splits/test.txt
  source_dir: /kaggle/working/S05/data/test
  protected_dir: /kaggle/working/S05/results/prot_{method}_test/images
  out: /kaggle/working/S05/results/smoke_noise_uniform_test
- name: smoke_noise_uniform_val
  tier: SMOKE
  method: noise_uniform
  split: val
  split_file: /kaggle/working/S05/splits/val.txt
  source_dir: /kaggle/working/S05/data/val
  protected_dir: /kaggle/working/S05/results/prot_{method}_val/images
  out: /kaggle/working/S05/results/smoke_noise_uniform_val
- name: smoke_noise_uniform_messy
  tier: SMOKE
  method: noise_uniform
  split: messy
  split_file: /kaggle/working/S05/splits/messy.txt
  source_dir: /kaggle/working/S05/data/messy
  protected_dir: /kaggle/working/S05/results/prot_{method}_messy/images
  out: /kaggle/working/S05/results/smoke_noise_uniform_messy
